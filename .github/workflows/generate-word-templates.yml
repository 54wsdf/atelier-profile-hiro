name: Generate HIRO2026 Word templates

on:
  push:
    branches:
      - word-templates-20260821
    paths:
      - tools/generate_word_templates.py
      - .github/workflows/generate-word-templates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-word-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: word-templates-20260821

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Generate feature, symposium and essay DOCX
        run: python tools/generate_word_templates.py

      - name: Commit generated templates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add word/hiro2026-feature.docx word/hiro2026-symposium.docx word/hiro2026-essay.docx
          if git diff --cached --quiet; then
            echo 'Word templates are already current.'
            exit 0
          fi
          git commit -m 'word: generate HIRO2026 Word templates'
          git push origin HEAD:word-templates-20260821
